services:
  # 1. FastAPI Behavioral Risk Engine & SOC Backend
  - type: web
    name: bola-backend-api
    runtime: python
    rootDir: bola-benchmark
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # 2. React Security & Threat Intelligence Frontend
  - type: web
    name: bola-frontend-dashboard
    runtime: static
    rootDir: bola-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bola-backend-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
