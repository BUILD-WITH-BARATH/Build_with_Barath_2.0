[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberaccess-sdk"
version = "0.1.0"
description = "Drop-in BOLA/IDOR behavioral defense for Python APIs - a thin client for the CyberAccess /v1/authorize API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["cyberaccess_sdk*"]
